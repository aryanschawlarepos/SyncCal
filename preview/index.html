<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadence - Planner Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0f;
      --surface: #16161c;
      --surface-2: #20202a;
      --stroke: #2a2a34;
      --amber: #f5b841;
      --amber-soft: rgba(245, 184, 65, .14);
      --text: #f5f5f7;
      --muted: #9a9aa6;
      --dim: #63636e;
      --green: #77d6a4;
      --blue: #6aa9ff;
      --coral: #ff8b74;
      --purple: #b291ff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #050508; color: var(--text); display: grid; place-items: center; }
    button { font: inherit; color: inherit; }
    .phone { width: min(100%, 430px); min-height: 100vh; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 0 80px rgba(245,184,65,.08); }
    .glow { position: absolute; inset: -120px 0 auto; height: 360px; pointer-events: none; background: radial-gradient(ellipse at 50% 0, rgba(245,184,65,.12), transparent 68%); }
    .screen { min-height: 100vh; display: flex; flex-direction: column; position: relative; }
    .content { flex: 1; overflow: auto; padding-bottom: 92px; }
    header { display: flex; align-items: end; justify-content: space-between; padding: 28px 20px 18px; position: relative; }
    .eyebrow { color: var(--amber); font-size: 13px; font-weight: 700; letter-spacing: .02em; margin-top: 5px; }
    h1 { margin: 0; font-size: 32px; line-height: 1; letter-spacing: 0; }
    .today-pill { border: 1px solid var(--stroke); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 9px 13px; font-weight: 650; font-size: 13px; }
    .section { padding: 0 16px; }
    .section-label { color: var(--dim); font-size: 11px; font-weight: 800; letter-spacing: .12em; margin: 0 0 10px 74px; }
    .all-day { margin: 0 16px 18px; padding: 12px; border: 1px solid var(--stroke); border-radius: 12px; background: var(--surface); }
    .all-day .section-label { margin-left: 0; }
    .event { display: flex; gap: 10px; border: 1px solid color-mix(in srgb, var(--event-color) 38%, var(--stroke)); background: color-mix(in srgb, var(--event-color) 13%, var(--surface)); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
    .event:last-child { margin-bottom: 0; }
    .bar { width: 4px; border-radius: 5px; background: var(--event-color); flex: none; }
    .event-main { min-width: 0; }
    .event-title { font-weight: 750; font-size: 15px; line-height: 1.2; }
    .event-time { color: var(--muted); font-size: 12px; font-weight: 650; margin-top: 5px; }
    .event-meta { color: var(--dim); font-size: 12px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline { padding: 0 16px; }
    .hour { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; min-height: 64px; }
    .hour-label { color: var(--dim); font-size: 12px; font-weight: 700; padding-top: 1px; }
    .hour-body { border-top: 1px solid var(--stroke); padding: 8px 0 12px; }
    .empty { color: var(--muted); font-size: 13px; margin: 0 0 12px 70px; }
    .fab { position: absolute; right: 22px; bottom: 76px; width: 62px; height: 62px; border: 0; border-radius: 50%; color: var(--bg); background: linear-gradient(135deg, #f7c65b, #e9a227); font-size: 28px; box-shadow: 0 12px 28px rgba(245,184,65,.35); cursor: pointer; }
    .tabs { position: absolute; bottom: 0; left: 0; right: 0; height: 72px; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--stroke); background: rgba(11,11,15,.95); backdrop-filter: blur(18px); }
    .tab { border: 0; background: none; color: var(--dim); display: grid; place-items: center; align-content: center; gap: 4px; cursor: pointer; font-size: 12px; font-weight: 700; }
    .tab.active { color: var(--amber); }
    .tab-icon { font-size: 21px; line-height: 1; }
    .calendar-view { padding: 0 16px 20px; }
    .month-grid { background: var(--surface); border: 1px solid var(--stroke); border-radius: 16px; padding: 14px 10px 12px; }
    .month-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 5px; }
    .weekday { color: var(--dim); font-size: 10px; font-weight: 800; padding-bottom: 8px; }
    .day { color: var(--muted); height: 38px; display: grid; place-items: center; font-size: 13px; border-radius: 50%; position: relative; }
    .day.selected { color: var(--bg); background: var(--amber); font-weight: 800; }
    .day.dot::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--amber); position: absolute; bottom: 4px; }
    .day.selected::after { background: var(--bg); }
    .agenda-heading { display: flex; justify-content: space-between; align-items: center; margin: 18px 4px 10px; }
    .agenda-heading strong { font-size: 17px; }
    .agenda-heading span { color: var(--amber); font-size: 13px; font-weight: 700; }
    @media (min-width: 600px) { .phone { min-height: 760px; height: 92vh; border: 1px solid var(--stroke); border-radius: 28px; } .screen { min-height: 0; height: 100%; } }
  </style>
</head>
<body>
  <main class="phone" aria-label="Cadence live preview">
    <div class="glow"></div>
    <section class="screen">
      <div id="app" class="content"></div>
      <button class="fab" id="add" aria-label="Add event">+</button>
      <nav class="tabs" aria-label="Main tabs">
        <button class="tab" data-tab="calendar"><span class="tab-icon">▣</span><span>Calendar</span></button>
        <button class="tab active" data-tab="planner"><span class="tab-icon">☷</span><span>Planner</span></button>
      </nav>
    </section>
  </main>
  <script>
    const palette = { amber: '#f5b841', green: '#77d6a4', blue: '#6aa9ff', coral: '#ff8b74', purple: '#b291ff' };
    const state = { tab: 'planner', added: false };
    const events = [
      { title: 'Morning focus', start: 8.5, end: 9.5, color: palette.amber, meta: 'Personal' },
      { title: 'Product sync', start: 10, end: 11, color: palette.blue, meta: 'Work calendar · Conference room' },
      { title: 'Design review', start: 13.5, end: 14.5, color: palette.purple, meta: 'Work calendar · Studio 2' },
      { title: 'Dinner with Sam', start: 18, end: 19.5, color: palette.coral, meta: 'Personal · Bistro 38' }
    ];
    const pad = value => String(value).padStart(2, '0');
    const dateLabel = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'short', day: 'numeric' }).format(new Date());
    const timeLabel = hour => {
      const h = Math.floor(hour); const minutes = Math.round((hour - h) * 60);
      const suffix = h >= 12 ? 'PM' : 'AM'; const display = h % 12 || 12;
      return `${display}:${pad(minutes)} ${suffix}`;
    };
    const hourLabel = hour => `${hour % 12 || 12} ${hour >= 12 ? 'PM' : 'AM'}`;
    function eventCard(event) {
      return `<article class="event" style="--event-color:${event.color}"><div class="bar"></div><div class="event-main"><div class="event-title">${event.title}</div><div class="event-time">${timeLabel(event.start)} - ${timeLabel(event.end)}</div><div class="event-meta">${event.meta}</div></div></article>`;
    }
    function renderPlanner() {
      const timed = state.added ? [...events, { title: 'Late planning block', start: 20.5, end: 21.5, color: palette.green, meta: 'Work calendar' }] : events;
      const start = Math.min(8, ...timed.map(event => Math.floor(event.start)));
      const end = Math.max(...timed.map(event => event.end));
      let rows = '';
      for (let hour = start; hour <= Math.floor(end); hour++) {
        const rowEvents = timed.filter(event => event.start >= hour && event.start < hour + 1);
        rows += `<div class="hour"><div class="hour-label">${hourLabel(hour)}</div><div class="hour-body">${rowEvents.map(eventCard).join('')}</div></div>`;
      }
      document.getElementById('app').innerHTML = `<header><div><h1>Planner</h1><div class="eyebrow">${dateLabel}</div></div><div class="today-pill">Today</div></header><section class="all-day"><div class="section-label">ALL DAY</div><div class="event" style="--event-color:${palette.green}"><div class="bar"></div><div class="event-main"><div class="event-title">Team offsite</div><div class="event-time">All day</div><div class="event-meta">Work calendar</div></div></div></section><section class="timeline">${timed.length ? rows : '<p class="empty">No timed events</p>'}</section>`;
    }
    function renderCalendar() {
      const days = Array.from({ length: 35 }, (_, index) => index - 2);
      document.getElementById('app').innerHTML = `<header><div><h1>July</h1><div class="eyebrow">2026</div></div><div class="today-pill">Today</div></header><section class="calendar-view"><div class="month-grid"><div class="month-row">${['S','M','T','W','T','F','S'].map(day => `<div class="weekday">${day}</div>`).join('')}</div><div class="month-row">${days.map(day => `<div class="day ${day === 16 ? 'selected' : ''} ${[3, 8, 16, 22, 28].includes(day) ? 'dot' : ''}">${day > 0 && day < 32 ? day : ''}</div>`).join('')}</div></div><div class="agenda-heading"><strong>Thursday, Jul 16</strong><span>Today</span></div>${events.slice(0, 3).map(eventCard).join('')}</section>`;
    }
    function render() { state.tab === 'planner' ? renderPlanner() : renderCalendar(); document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === state.tab)); }
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => { state.tab = tab.dataset.tab; render(); }));
    document.getElementById('add').addEventListener('click', () => { state.added = true; state.tab = 'planner'; render(); });
    render();
  </script>
</body>
</html>
